 width="83" height="42" rx="5" fill="#d9eae9"/><rect x="1181" y="645" width="83" height="42" rx="5" fill="#eaf4f3"/><text x="65" y="748" font-size="16" font-weight="700" fill="#10263F" text-anchor="start">Answer: seasonality is not uniform. High-value departments peak in different months, so the overall monthly curve hides important mix effects.</text><text x="65" y="780" font-size="13" font-weight="500" fill="#64748B" text-anchor="start">Values are averages within the filtered local sample, not enterprise department totals.</text></svg>