  <line x1="1135" y1="478" x2="1162" y2="478" stroke="#2C7A6B" stroke-width="2"/>
  <polygon points="1162,478 1151,471 1151,485" fill="#2C7A6B"/>

  <rect x="1180" y="430" width="175" height="95" rx="18" fill="#FBFAF7" stroke="#C9D0D4"/>
  <text x="1202" y="468" font-size="17" font-weight="700" fill="#14202B">MARTS</text>
  <text x="1202" y="497" font-size="14" fill="#68737D">analytics</text>
  


  <text x="80" y="610" font-size="14" font-weight="700" fill="#68737D">WHAT THE TRUSTED DATA SHOWED</text>

  <text x="80" y="685" font-size="42" font-weight="800" fill="#426C86">44,837</text>
  <text x="80" y="724" font-size="17" fill="#68737D">December avg. qualifying weekly sales</text>

  <text x="530" y="685" font-size="42" font-weight="800" fill="#2C7A6B">52.9%</text>
  <text x="530" y="724" font-size="17" fill="#68737D">of qualifying sales from the top 10 departments</text>

  <text x="1035" y="685" font-size="42" font-weight="800" fill="#B86535">+5.5%</text>
  <text x="1035" y="724" font-size="17" fill="#68737D">overall holiday-week difference in this sample</text>

  <line x1="80" y1="780" x2="1520" y2="780" stroke="#C9D0D4"/>
  <text x="80" y="820" font-size="13" font-weight="700" fill="#68737D">Python / SQL / Parquet / Pytest / GitHub Actions / Seaborn</text>
  <text x="1520" y="820" font-size="13" text-anchor="end" fill="#68737D">20,000-row local sample</text>
