  <text x="1115" y="425" font-size="12" fill="#68737D">Jan</text>
  <text x="1457" y="425" font-size="12" fill="#68737D">Dec</text>
  <text x="1472.0" y="336.0" font-size="15" font-weight="700" text-anchor="end" fill="#B86535">$44.8k</text>

  <text x="80" y="400" font-size="14" font-weight="700" fill="#68737D">PIPELINE</text>
  
  <rect x="80" y="430" width="175" height="95" rx="18" fill="#FBFAF7" stroke="#C9D0D4"/>
  <text x="102" y="468" font-size="17" font-weight="700" fill="#14202B">SQL</text>
  <text x="102" y="497" font-size="14" fill="#68737D">sales extract</text>
