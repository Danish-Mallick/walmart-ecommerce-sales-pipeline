<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780"><rect width="100%" height="100%" fill="#F7F9FC"/><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}</style><text x="70" y="84" font-size="18" font-weight="700" fill="#0F766E" text-anchor="start">WALMART RETAIL DATA PIPELINE</text><text x="70" y="142" font-size="46" font-weight="800" fill="#10263F" text-anchor="start">From raw extracts to trusted analytics</text><text x="70" y="184" font-size="22" font-weight="400" fill="#64748B" text-anchor="start">A tested ETL workflow with data contracts, quality gates and downstream analytical marts.</text><rect x="70" y="230" width="330" height="130" rx="16" fill="#FFFFFF" stroke="#D8E2EB"/><rect x="70" y="230" width="8" height="130" rx="4" fill="#2563EB"/><text x="98" y="264" font-size="14" font-weight="700" fill="#64748B" text-anchor="start">CURATED ROWS</text><text x="98" y="310" font-size="34" font-weight="800" fill="#2563EB" text-anchor="start">10,946</text><text x="98" y="342" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">after default sales filter</text><rect x="440" y="230" width="330" height="130" rx="16" fill="#FFFFFF" stroke="#D8E2EB"/><rect x="440" y="230" width="8" height="130" rx="4" fill="#0F766E"/><text x="468" y="264" font-size="14" font-weight="700" fill="#64748B" text-anchor="start">DEPARTMENTS</text><text x="468" y="310" font-size="34" font-weight="800" fill="#0F766E" text-anchor="start">62</text><text x="468" y="342" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">represented in the sample</text><rect x="810" y="230" width="330" height="130" rx="16" fill="#FFFFFF" stroke="#D8E2EB"/><rect x="810" y="230" width="8" height="130" rx="4" fill="#D97706"/><text x="838" y="264" font-size="14" font-weight="700" fill="#64748B" text-anchor="start">PEAK MONTH</text><text x="838" y="310" font-size="34" font-weight="800" fill="#D97706" text-anchor="start">December</text><text x="838" y="342" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">$44,837 avg.</text><rect x="1180" y="230" width="330" height="130" rx="16" fill="#FFFFFF" stroke="#D8E2EB"/><rect x="1180" y="230" width="8" height="130" rx="4" fill="#C2410C"/><text x="1208" y="264" font-size="14" font-weight="700" fill="#64748B" text-anchor="start">HOLIDAY DIFFERENCE</text><text x="1208" y="310" font-size="34" font-weight="800" fill="#C2410C" text-anchor="start">+5.5%</text><text x="1208" y="342" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">descriptive, not causal</text><text x="70" y="414" font-size="15" font-weight="800" fill="#10263F" text-anchor="start">PIPELINE</text><rect x="70" y="445" width="155" height="68" rx="13" fill="#EEF4F8" stroke="#C8D6E2"/><text x="147.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">SQL extract</text><line x1="225" y1="479" x2="245" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="245,479 237,474 237,484" fill="#0F766E"/><rect x="255" y="445" width="155" height="68" rx="13" fill="#EEF4F8" stroke="#C8D6E2"/><text x="332.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">Parquet enrich</text><line x1="410" y1="479" x2="445" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="445,479 437,474 437,484" fill="#0F766E"/><rect x="455" y="445" width="155" height="68" rx="13" fill="#FFFFFF" stroke="#C8D6E2"/><text x="532.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">1:1 merge</text><line x1="610" y1="479" x2="640" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="640,479 632,474 632,484" fill="#0F766E"/><rect x="650" y="445" width="155" height="68" rx="13" fill="#FFFFFF" stroke="#C8D6E2"/><text x="727.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">Transform</text><line x1="805" y1="479" x2="825" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="825,479 817,474 817,484" fill="#0F766E"/><rect x="835" y="445" width="155" height="68" rx="13" fill="#FFFFFF" stroke="#C8D6E2"/><text x="912.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">Quality gates</text><line x1="990" y1="479" x2="1010" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="1010,479 1002,474 1002,484" fill="#0F766E"/><rect x="1020" y="445" width="155" height="68" rx="13" fill="#FFFFFF" stroke="#C8D6E2"/><text x="1097.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">Curated data</text><line x1="1175" y1="479" x2="1205" y2="479" stroke="#0F766E" stroke-width="2"/><polygon points="1205,479 1197,474 1197,484" fill="#0F766E"/><rect x="1215" y="445" width="155" height="68" rx="13" fill="#FFFFFF" stroke="#C8D6E2"/><text x="1292.5" y="486" font-size="14" font-weight="700" fill="#10263F" text-anchor="middle">Analytics marts</text><rect x="70" y="560" width="1460" height="160" rx="16" fill="#FFFFFF" stroke="#D8E2EB"/><text x="95" y="594" font-size="14" font-weight="800" fill="#64748B" text-anchor="start">MONTHLY ANALYTICS OUTPUT</text><polyline points="105,669.9886662827223 186.8181818181818,662.1740690964468 268.6363636363636,672.8402902564105 350.4545454545455,669.1547305930653 432.27272727272725,669.3065716227605 514.090909090909,650.0687974222673 595.909090909091,667.5456507305507 677.7272727272727,669.720490376085 759.5454545454545,668.6753688290396 841.3636363636364,676.4234246237862 923.1818181818181,638.9044939938083 1005,626.4660822665145" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="105" cy="669.9886662827223" r="4" fill="#2563EB"/><circle cx="186.8181818181818" cy="662.1740690964468" r="4" fill="#2563EB"/><circle cx="268.6363636363636" cy="672.8402902564105" r="4" fill="#2563EB"/><circle cx="350.4545454545455" cy="669.1547305930653" r="4" fill="#2563EB"/><circle cx="432.27272727272725" cy="669.3065716227605" r="4" fill="#2563EB"/><circle cx="514.090909090909" cy="650.0687974222673" r="4" fill="#2563EB"/><circle cx="595.909090909091" cy="667.5456507305507" r="4" fill="#2563EB"/><circle cx="677.7272727272727" cy="669.720490376085" r="4" fill="#2563EB"/><circle cx="759.5454545454545" cy="668.6753688290396" r="4" fill="#2563EB"/><circle cx="841.3636363636364" cy="676.4234246237862" r="4" fill="#2563EB"/><circle cx="923.1818181818181" cy="638.9044939938083" r="6" fill="#D97706"/><circle cx="1005" cy="626.4660822665145" r="6" fill="#D97706"/><text x="105" y="708" font-size="12" font-weight="500" fill="#64748B" text-anchor="start">Jan</text><text x="1005" y="708" font-size="12" font-weight="500" fill="#64748B" text-anchor="end">Dec</text><text x="1065" y="608" font-size="16" font-weight="800" fill="#10263F" text-anchor="start">What the curated data shows</text><text x="1065" y="642" font-size="16" font-weight="500" fill="#10263F" text-anchor="start">• November and December have the strongest monthly averages.</text><text x="1065" y="670" font-size="16" font-weight="500" fill="#10263F" text-anchor="start">• Top 10 departments contribute 52.9% of qualifying sales.</text><text x="1065" y="698" font-size="16" font-weight="500" fill="#10263F" text-anchor="start">• Holiday sensitivity varies sharply by department.</text></svg>