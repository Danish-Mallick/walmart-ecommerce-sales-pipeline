  <text x="80" y="95" font-size="18" font-weight="700" fill="#426C86">WALMART RETAIL SALES</text>
  <text x="80" y="178" font-size="54" font-weight="800" fill="#14202B">A retail data pipeline,</text>
  <text x="80" y="238" font-size="54" font-weight="800" fill="#14202B">then an analytics layer.</text>

  <text x="80" y="305" font-size="20" fill="#68737D">I built the pipeline first — validating joins, schema and outputs —</text>
  <text x="80" y="337" font-size="20" fill="#68737D">then used the curated data to study seasonality, department mix and holiday behaviour.</text>

  <text x="1115" y="95" font-size="17" font-weight="700" fill="#14202B">Average qualifying weekly sales</text>
  <line x1="1115" y1="391" x2="1480" y2="391" stroke="#C9D0D4"/>
  <line x1="1115" y1="348" x2="1480" y2="348" stroke="#C9D0D4"/>
  <text x="1100" y="396" font-size="12" text-anchor="end" fill="#68737D">$40k</text>
  <text x="1100" y="353" font-size="12" text-anchor="end" fill="#68737D">$44k</text>
  <polyline points="1115.0,453.7 1148.2,435.8 1181.4,460.3 1214.5,451.8 1247.7,452.2 1280.9,408.1 1314.1,448.1 1347.3,453.1 1380.5,450.7 1413.6,468.5 1446.8,382.5 1480.0,354.0" fill="none" stroke="#426C86" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
