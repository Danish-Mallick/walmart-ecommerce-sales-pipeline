<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
  <rect width="1600" height="850" fill="#F4F1EA"/>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
