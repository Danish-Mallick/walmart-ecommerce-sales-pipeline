  <text x="322" y="497" font-size="14" fill="#68737D">enrichment</text>
  <line x1="475" y1="478" x2="502" y2="478" stroke="#2C7A6B" stroke-width="2"/>
  <polygon points="502,478 491,471 491,485" fill="#2C7A6B"/>

  <rect x="520" y="430" width="175" height="95" rx="18" fill="#FBFAF7" stroke="#C9D0D4"/>
