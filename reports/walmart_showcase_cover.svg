<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Walmart Retail Sales Data Pipeline &amp; Analytics</title>
  <desc id="desc">Portfolio cover showing project KPIs and a raw-to-analytics data pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset=".55" stop-color="#0a1a2c"/>
      <stop offset="1" stop-color="#06101c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset=".55" stop-color="#6fd2ff"/>
      <stop offset="1" stop-color="#ffc738"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea6ff"/>
      <stop offset=".65" stop-color="#6fd2ff"/>
      <stop offset="1" stop-color="#41d6a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="-40" r="250" fill="#2ea6ff" opacity=".045"/>
  <circle cx="1050" cy="-40" r="175" fill="none" stroke="#6fd2ff" stroke-opacity=".15"/>
  <circle cx="1050" cy="-40" r="245" fill="none" stroke="#6fd2ff" stroke-opacity=".07"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="54" y="61" font-size="19" font-weight="700" letter-spacing="2.2" fill="#6fd2ff">PORTFOLIO PROJECT · DATA ENGINEERING × ANALYTICS</text>
    <text x="54" y="116" font-size="40" font-weight="800" fill="#f4f8ff">Walmart Retail Sales</text>
    <text x="54" y="174" font-size="55" font-weight="900" fill="url(#titleGrad)">Data Pipeline &amp; Analytics</text>
    <text x="56" y="211" font-size="17" fill="#9cb0c9">SQL + Parquet → validated curated layer → analytical marts → CI-tested insights</text>

    <rect x="936" y="44" width="210" height="37" rx="18.5" fill="#10253d" stroke="#2ea6ff" stroke-opacity=".75"/>
    <circle cx="957" cy="62.5" r="5" fill="#41d6a3"/>
    <text x="972" y="68" font-size="13" font-weight="700" fill="#d8f2ff">INTERACTIVE SHOWCASE</text>

    <!-- KPI cards -->
    <g filter="url(#shadow)">
      <rect x="54" y="249" width="258" height="116" rx="18" fill="#10253d" stroke="#234663"/>
      <rect x="326" y="249" width="258" height="116" rx="18" fill="#10253d" stroke="#234663"/>
      <rect x="598" y="249" width="258" height="116" rx="18" fill="#10253d" stroke="#234663"/>
      <rect x="870" y="249" width="276" height="116" rx="18" fill="#10253d" stroke="#234663"/>
    </g>
    <rect x="54" y="249" width="258" height="2" rx="1" fill="#2ea6ff"/>
    <rect x="326" y="249" width="258" height="2" rx="1" fill="#ffc738"/>
    <rect x="598" y="249" width="258" height="2" rx="1" fill="#41d6a3"/>
    <rect x="870" y="249" width="276" height="2" rx="1" fill="#b58cff"/>

    <text x="76" y="282" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9cb0c9">LOCAL SAMPLE</text>
    <text x="76" y="327" font-size="34" font-weight="900" fill="#f4f8ff">20,000</text>
    <text x="76" y="350" font-size="12" fill="#7890aa">rows processed locally</text>

    <text x="348" y="282" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9cb0c9">TOP 10 SHARE</text>
    <text x="348" y="327" font-size="34" font-weight="900" fill="#f4f8ff">52.9%</text>
    <text x="348" y="350" font-size="12" fill="#7890aa">of qualifying sales</text>

    <text x="620" y="282" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9cb0c9">HOLIDAY DIFFERENCE</text>
    <text x="620" y="327" font-size="34" font-weight="900" fill="#f4f8ff">+5.5%</text>
    <text x="620" y="350" font-size="12" fill="#7890aa">sample-level average</text>

    <text x="892" y="282" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9cb0c9">DECEMBER AVG.</text>
    <text x="892" y="327" font-size="34" font-weight="900" fill="#f4f8ff">$44,837</text>
    <text x="892" y="350" font-size="12" fill="#7890aa">qualifying weekly sales</text>

    <text x="56" y="410" font-size="22" font-weight="800" fill="#f4f8ff">Raw → trusted → analytical</text>
    <text x="56" y="433" font-size="13" fill="#7890aa">A compact view of the project's full data journey</text>

    <!-- Pipeline -->
    <rect x="54" y="454" width="1092" height="126" rx="20" fill="#0f243b" stroke="#234663"/>
    <line x1="113" y1="501" x2="1087" y2="501" stroke="url(#blueLine)" stroke-width="2" opacity=".8"/>

    <g text-anchor="middle">
      <g transform="translate(118 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="16" font-weight="700" fill="#f4f8ff">SQL</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Sales extract</text>
      </g>
      <g transform="translate(258 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="18" fill="#f4f8ff">◆</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Parquet</text>
      </g>
      <g transform="translate(398 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="16" font-weight="700" fill="#f4f8ff">1:1</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Merge</text>
      </g>
      <g transform="translate(538 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="20" fill="#f4f8ff">ƒ</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Transform</text>
      </g>
      <g transform="translate(678 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="19" fill="#f4f8ff">✓</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Quality gates</text>
      </g>
      <g transform="translate(818 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="16" font-weight="700" fill="#f4f8ff">DB</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Curated layer</text>
      </g>
      <g transform="translate(958 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="18" fill="#f4f8ff">▦</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Data marts</text>
      </g>
      <g transform="translate(1087 0)">
        <rect x="-29" y="471" width="58" height="58" rx="15" fill="#091a2d" stroke="#28506e"/>
        <text y="507" font-size="20" fill="#f4f8ff">↗</text>
        <text y="552" font-size="11" font-weight="700" fill="#f4f8ff">Insights</text>
      </g>
    </g>

    <text x="56" y="611" font-size="13" fill="#7187a0">Click this cover in GitHub to open the live interactive project showcase</text>
  </g>
</svg>